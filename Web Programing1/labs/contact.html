<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Muhammed Ali - Contact</title>
</head>
<body>

    <header>
        <h1>Muhammed Ali</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="service.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Get in Touch</h2>
            <p>If you have any questions about my web development projects or Starbucks store management, feel free to send me a message using the form below.</p>

            <form action="#" method="post">
                <fieldset>
                    <legend>Contact Form</legend>

                    <p>
                        <label for="fullname">Full Name:</label><br>
                        <input type="text" id="fullname" name="fullname" required>
                    </p>

                    <p>
                        <label for="email">Email Address:</label><br>
                        <input type="email" id="email" name="email" required>
                    </p>

                    <p>
                        <label for="contact-date">Preferred Contact Date:</label><br>
                        <input type="date" id="contact-date" name="contact-date">
                    </p>

                    <p>
                        <label for="subject">Subject / Inquiry Type:</label><br>
                        <select id="subject" name="subject">
                            <option value="web-project">Web Development Project</option>
                            <option value="store-management">Store Management Inquiry</option>
                            <option value="coffee-recommendation">Coffee Recommendation</option>
                            <option value="other">Other</option>
                        </select>
                    </p>

                    <p>
                        <label for="message">Your Message:</label><br>
                        <textarea id="message" name="message" rows="5" cols="30" placeholder="Write your message here..."></textarea>
                    </p>

                    <p>
                        <button type="submit">Send Message</button>
                    </p>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>Copyright 2026 Muhammed Ali Uğur</p>
    </footer>

</body>
</html>
